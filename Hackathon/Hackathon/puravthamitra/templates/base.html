<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Supplier Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f9fdf9;
      color: #212529;
    }

    .sidebar {
      min-height: 100vh;
      background-color: #e8f5e9;
      padding-top: 1rem;
      border-right: 1px solid #c8e6c9;
    }

    .sidebar .nav-link {
      font-weight: 500;
      color: #2e7d32;
      border-radius: 0.375rem;
    }

    .sidebar .nav-link:hover {
      background-color: #c8e6c9;
      color: #1b5e20;
    }

    .sidebar .nav-link.active {
      background-color: #198754;
      color: #fff;
    }

    .navbar-brand {
      color: #198754 !important;
      font-weight: bold;
    }

    .btn-outline-success {
      border-color: #198754;
      color: #198754;
    }

    .btn-outline-success:hover {
      background-color: #198754;
      color: #fff;
    }

    .btn-outline-danger:hover {
      background-color: #dc3545;
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm px-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'supplier_dashboard' %}">
        🛒 Supplier Panel
      </a>
      <div class="d-flex align-items-center">
        <a href="{% url 'logout' %}" class="btn btn-outline-danger">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Layout -->
  <div class="container-fluid">
    <div class="row flex-nowrap">
      <!-- Sidebar -->
      <div class="col-md-2 col-lg-2 d-none d-md-block sidebar">
        <ul class="nav flex-column px-3">
          <li class="nav-item"><a href="{% url 'supplier_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'supplier_dashboard' %}active{% endif %}">📦 Dashboard</a></li>
          <li class="nav-item"><a href="{% url 'add_product' %}" class="nav-link {% if request.resolver_match.url_name == 'add_product' %}active{% endif %}">➕ Add Product</a></li>
          <li class="nav-item"><a href="{% url 'inventory' %}" class="nav-link {% if request.resolver_match.url_name == 'inventory' %}active{% endif %}">📋 Inventory</a></li>
          <li class="nav-item"><a href="{% url 'orders' %}" class="nav-link {% if request.resolver_match.url_name == 'orders' %}active{% endif %}">📑 Orders</a></li>
          <li class="nav-item"><a href="{% url 'account' %}" class="nav-link {% if request.resolver_match.url_name == 'account' %}active{% endif %}">👤 Account</a></li>
          <li class="nav-item"><a href="{% url 'history' %}" class="nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}">🕓 History</a></li>
        </ul>
      </div>

      <!-- Mobile Collapsible Menu -->
      <div class="col-12 d-md-none bg-light border-bottom px-3 py-2">
        <button class="btn btn-outline-success w-100" data-bs-toggle="collapse" data-bs-target="#mobileSidebar">☰ Menu</button>
        <div class="collapse mt-2" id="mobileSidebar">
          <ul class="nav flex-column">
            <li class="nav-item"><a href="{% url 'supplier_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'supplier_dashboard' %}active{% endif %}">📦 Dashboard</a></li>
            <li class="nav-item"><a href="{% url 'add_product' %}" class="nav-link {% if request.resolver_match.url_name == 'add_product' %}active{% endif %}">➕ Add Product</a></li>
            <li class="nav-item"><a href="{% url 'inventory' %}" class="nav-link {% if request.resolver_match.url_name == 'inventory' %}active{% endif %}">📋 Inventory</a></li>
            <li class="nav-item"><a href="{% url 'orders' %}" class="nav-link {% if request.resolver_match.url_name == 'orders' %}active{% endif %}">📑 Orders</a></li>
            <li class="nav-item"><a href="{% url 'account' %}" class="nav-link {% if request.resolver_match.url_name == 'account' %}active{% endif %}">👤 Account</a></li>
            <li class="nav-item"><a href="{% url 'history' %}" class="nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}">🕓 History</a></li>
          </ul>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col py-4 px-4">
        {% block content %}
        {% endblock %}
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
