<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vendor Panel - PuravthaMitra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      display: flex;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .sidebar {
      width: 220px;
      background-color: #198754; /* Green theme */
      color: #fff;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      padding-top: 30px;
    }

    .sidebar a {
      color: #fff;
      padding: 12px 20px;
      display: block;
      text-decoration: none;
      transition: background 0.2s;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #157347;
    }

    .content {
      margin-left: 220px;
      padding: 30px;
      background-color: #f8f9fa;
      min-height: 100vh;
      width: calc(100% - 220px);
    }

    .sidebar h4 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
    }

  </style>
</head>
<body>
  <div class="sidebar">
    <h4>👨‍🍳 Vendor</h4>
    <a href="{% url 'vendor_dashboard' %}" class="{% if request.path == '/dashboard/' %}active{% endif %}">📊 Dashboard</a>
    <a href="{% url 'browse_products' %}" class="{% if request.path == '/browse/' %}active{% endif %}">🛍 Browse Products</a>
    <a href="{% url 'view_cart' %}" class="{% if request.path == '/cart/' %}active{% endif %}">🛒 My Cart</a>
    <a href="{% url 'my_orders' %}" class="{% if request.path == '/orders/' %}active{% endif %}">📦 My Orders</a>
    <a href="{% url 'vendor_login' %}">🔓 Logout</a>
  </div>

  <div class="content">
    {% block content %}
    {% endblock %}
  </div>

  <!-- Bootstrap JS (optional if using interactive components) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
