<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PuravthaMitra - Empowering Street Vendors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: url("/media/product_images/home bg.png") no-repeat center center fixed;
                  
      background-size: cover;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-wrapper {
      max-width: 800px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 4rem 3rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      backdrop-filter: blur(10px);
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      color: #2d3436;
    }

    .tagline {
      font-size: 1.2rem;
      color: #555;
      margin: 1rem 0 2rem;
    }

    .btn-custom {
      padding: 0.75rem 2rem;
      font-size: 1rem;
      border-radius: 10px;
      transition: all 0.3s ease;
      border: none;
    }

    .btn-vendor {
      background-color: #1e88e5;
      color: white;
    }

    .btn-vendor:hover {
      background-color: #1565c0;
      color: white;
    }

    .btn-supplier {
      background-color: #43a047;
      color: white;
    }

    .btn-supplier:hover {
      background-color: #2e7d32;
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="hero-wrapper">
    <h1>👋 Welcome to <span style="color: #388e3c;">PuravthaMitra</span></h1>
    <p class="tagline">Empowering street food vendors with trusted & affordable raw material connections</p>
    <div class="d-flex justify-content-center gap-3 flex-wrap">
      <a href="{% url 'vendor_login' %}" class="btn btn-custom btn-vendor">Vendor Login</a>
      <a href="/suppliers/login/" class="btn btn-custom btn-supplier">Supplier Login</a>
    </div>
  </div>
</body>
</html>
