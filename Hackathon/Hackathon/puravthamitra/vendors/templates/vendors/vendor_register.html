<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vendor Registration - PuravthaMitra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f0f4f8;
      font-family: 'Segoe UI', sans-serif;
    }
    .register-card {
      max-width: 500px;
      margin: 50px auto;
      background: #ffffff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      border-top: 4px solid #0d6efd;
      border-bottom: 4px solid #0d6efd;
    }
    .register-card h2 {
      color: #0d6efd;
    }
    .form-label {
      font-weight: 500;
    }
    .btn-primary {
      background-color: #0d6efd;
      border: none;
      transition: all 0.3s ease-in-out;
    }
    .btn-primary:hover {
      background-color: #084298;
    }
    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
    }
    .login-link a {
      text-decoration: none;
      color: #0d6efd;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-card">
    <h2 class="text-center mb-4">👨‍🍳 Vendor Registration</h2>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" name="username" id="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" name="password" id="password" required>
      </div>
      <div class="mb-3">
        <label for="shop_name" class="form-label">Shop Name</label>
        <input type="text" class="form-control" name="shop_name" id="shop_name" required>
      </div>
      <div class="mb-3">
        <label for="contact_number" class="form-label">Contact Number</label>
        <input type="text" class="form-control" name="contact_number" id="contact_number" required>
      </div>
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <textarea class="form-control" name="address" id="address" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

    <div class="text-center login-link mt-3">
      Already have an account? <a href="{% url 'vendor_login' %}">Login here</a>
    </div>
  </div>
</body>
</html>
