<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vendor Panel - PuravthaMitra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
    }
    .sidebar {
      min-width: 220px;
      background-color: #002B5B;
      color: #fff;
      height: 100vh;
      padding-top: 30px;
    }
    .sidebar a {
      color: #fff;
      padding: 12px 20px;
      display: block;
      text-decoration: none;
    }
    .sidebar a:hover, .sidebar a.active {
      background-color: #005B94;
    }
    .content {
      flex: 1;
      padding: 30px;
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h4 class="text-center mb-4">👨‍🍳 Vendor</h4>
    <a href="{% url 'vendor_dashboard' %}" class="{% if request.path == '/vendors/dashboard/' %}active{% endif %}">📊 Dashboard</a>
    <a href="{% url 'browse_products' %}" class="{% if request.path == '/vendors/browse-products/' %}active{% endif %}">🛍 Browse Products</a>
    <a href="{% url 'view_cart' %}" class="{% if request.path == '/vendors/my-cart/' %}active{% endif %}">🛒 My Cart</a>
    <a href="{% url 'my_orders' %}" class="{% if request.path == '/vendors/my-orders/' %}active{% endif %}">📦 My Orders</a>
  </div>
  <div class="content">
    {% block content %}
    {% endblock %}
  </div>
</body>
</html>
