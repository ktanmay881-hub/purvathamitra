<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Supplier Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: var(--bs-light);
      transition: background-color 0.3s, color 0.3s;
    }

    .sidebar {
      min-height: 100vh;
      background: #e8f5e9; /* light green */
      padding-top: 1rem;
      border-right: 1px solid #c8e6c9;
    }

    .sidebar .nav-link {
      font-weight: 500;
      color: #2e7d32;
      border-radius: 0.375rem;
    }

    .sidebar .nav-link:hover {
      background-color: #c8e6c9;
      color: #1b5e20;
    }

    .sidebar .nav-link.active {
      background-color: #198754; /* Bootstrap green */
      color: #fff;
    }

    .dark-mode {
      --bs-light: #212529;
      --bs-body-bg: #121212;
      --bs-body-color: #f8f9fa;
    }

    .dark-mode .sidebar {
      background: #1e1e1e;
    }

    .dark-mode .sidebar .nav-link {
      color: #ccc;
    }

    .dark-mode .sidebar .nav-link.active {
      background-color: #28a745;
      color: white;
    }

    .toggle-switch {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm px-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-success" href="{% url 'supplier_dashboard' %}">
        🛒 Supplier Panel
      </a>
      <div class="d-flex align-items-center">
        <button class="btn btn-outline-success me-3" id="themeToggle" title="Toggle Dark Mode">
          <i class="bi bi-moon-fill" id="themeIcon"></i>
        </button>
        <a href="{% url 'logout' %}" class="btn btn-outline-danger">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container-fluid">
    <div class="row flex-nowrap">
      <!-- Sidebar -->
      <div class="col-12 col-md-3 col-lg-2 sidebar d-md-block d-none">
        <ul class="nav flex-column px-3">
          <li class="nav-item"><a href="{% url 'supplier_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'supplier_dashboard' %}active{% endif %}">📦 Dashboard</a></li>
          <li class="nav-item"><a href="{% url 'add_product' %}" class="nav-link {% if request.resolver_match.url_name == 'add_product' %}active{% endif %}">➕ Add Product</a></li>
          <li class="nav-item"><a href="{% url 'inventory' %}" class="nav-link {% if request.resolver_match.url_name == 'inventory' %}active{% endif %}">📋 Inventory</a></li>
          <li class="nav-item"><a href="{% url 'orders' %}" class="nav-link {% if request.resolver_match.url_name == 'orders' %}active{% endif %}">📑 Orders</a></li>
          <li class="nav-item"><a href="{% url 'account' %}" class="nav-link {% if request.resolver_match.url_name == 'account' %}active{% endif %}">👤 Account</a></li>
          <li class="nav-item"><a href="{% url 'history' %}" class="nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}">🕓 History</a></li>
        </ul>
      </div>

      <!-- Mobile Sidebar -->
      <div class="col-12 d-md-none bg-light border-bottom px-3 py-2">
        <button class="btn btn-sm btn-outline-success w-100" data-bs-toggle="collapse" data-bs-target="#mobileSidebar">☰ Menu</button>
        <div class="collapse mt-2" id="mobileSidebar">
          <ul class="nav flex-column">
            <li class="nav-item"><a href="{% url 'supplier_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'supplier_dashboard' %}active{% endif %}">📦 Dashboard</a></li>
            <li class="nav-item"><a href="{% url 'add_product' %}" class="nav-link {% if request.resolver_match.url_name == 'add_product' %}active{% endif %}">➕ Add Product</a></li>
            <li class="nav-item"><a href="{% url 'inventory' %}" class="nav-link {% if request.resolver_match.url_name == 'inventory' %}active{% endif %}">📋 Inventory</a></li>
            <li class="nav-item"><a href="{% url 'orders' %}" class="nav-link {% if request.resolver_match.url_name == 'orders' %}active{% endif %}">📑 Orders</a></li>
            <li class="nav-item"><a href="{% url 'account' %}" class="nav-link {% if request.resolver_match.url_name == 'account' %}active{% endif %}">👤 Account</a></li>
            <li class="nav-item"><a href="{% url 'history' %}" class="nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}">🕓 History</a></li>
          </ul>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col py-4 px-4">
        {% block content %}
        {% endblock %}
      </div>
    </div>
  </div>

  <!-- Bootstrap + Theme Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toggleButton = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');

    toggleButton.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      if (document.body.classList.contains('dark-mode')) {
        icon.classList.remove('bi-moon-fill');
        icon.classList.add('bi-sun-fill');
      } else {
        icon.classList.remove('bi-sun-fill');
        icon.classList.add('bi-moon-fill');
      }
    });
  </script>
</body>
</html>
